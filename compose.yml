# Full stack: application + observability.
#   docker compose up -d
#
# Networks are defined only here. Included files must not redefine them —
# compose rejects that with "conflicts with imported resource".
include:
  - observability/compose.yaml
  - compose.app.yml

# Shared networks for all services
networks:
  observability:
    driver: bridge
    name: observability
  app:
    driver: bridge
    name: app