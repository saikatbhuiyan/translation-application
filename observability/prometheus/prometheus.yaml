global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'otel-collector'
    # Keep the app's own job label (from service.name) instead of overwriting it
    # with 'otel-collector'; without this it ends up in exported_job.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']