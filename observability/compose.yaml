# Observability stack entry point. Each component lives in its own folder
# (<component>/compose.yaml + its config); add a new one by creating the folder
# and listing it below.
#
# Run via the root compose.yml (it defines the shared `observability` network).

include:
  - prometheus/compose.yaml
  - loki/compose.yaml
  - tempo/compose.yaml
  - grafana/compose.yaml
  - collector/compose.yaml
